services:
  dobot-right:
    build:
      context: ..
      dockerfile: dobot-right-edge/Dockerfile
    image: ghcr.io/pudap/dobot-right-edge:latest
    container_name: dobot-right-edge
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./.env:/app/dobot-right-edge/.env:ro
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
