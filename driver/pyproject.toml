[project]
name = "dobot-driver"
version = "0.1.0"
description = "Reusable Dobot M1 Pro driver package"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.3",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dobot_driver"]
