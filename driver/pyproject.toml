[project]
name = "dobot-drivers"
version = "0.1.0"
description = "Shared drivers for Dobot M1 Pro robots"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.3",
    "puda>=0.0.18",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dobot_drivers"]
