services:
  dobot:
    build:
      context: ..
      dockerfile: edge/Dockerfile
    image: ghcr.io/pudap/dobot-edge:latest
    container_name: dobot-edge
    # Required so localhost NATS URLs resolve to the host broker.
    network_mode: host
    restart: unless-stopped
    # Mount host .env so config updates apply after recreate (see main.py Config).
    volumes:
      - ./.env:/app/edge/.env:ro
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
